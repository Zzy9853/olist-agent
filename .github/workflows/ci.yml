name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          # 版本锁定与本地环境一致（消除漂移导致的 import 失败）
          pip install sqlglot==30.14.0 mcp==1.27.0 langgraph==1.2.10 openai==2.38.0 \
            chromadb==1.5.9 shap==0.51.0 xgboost==3.2.0 duckdb==1.5.3 pandas==3.0.2
      - name: Syntax gate
        run: python -m compileall app scripts eval
      - name: Validator tests (no data / no API)
        run: python -m app.test_validator
      - name: MCP tools import check (no API calls)
        run: python -c "from app.mcp_server import ask_data, explain_user, list_tables, validate_sql; print('MCP tools OK')"
      - name: Judge module import check
        run: python -c "from app.judge import judge_answer; print('judge module OK')"
